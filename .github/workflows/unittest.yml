name: sophiread_unittest

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - qa
      - next
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sophiread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          manifest-path: sophiread/pixi.toml
      - name: Build and test
        run: |
          pixi run build
          pixi run test

  macos-latest:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sophiread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          manifest-path: sophiread/pixi.toml
      - name: Build and test
        run: |
          pixi run build
          pixi run test
