[project]
authors = ["Chen Zhang <zhangc@ornl.gov>"]
channels = ["conda-forge"]
name = "sophiread"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# Quick Start: pixi run dev-setup    (complete development setup)
#              pixi run setup-data    (download 12GB sample data)
#              pixi run run-notebooks (launch Jupyter with notebooks)

# Primary TDC-only build (default - Release mode)
configure = "cmake -G Ninja -S . -B build -DBUILD_PYTHON_BINDINGS=ON -DCMAKE_BUILD_TYPE=Release"
build = { cmd = "ninja -C build", depends-on = ["configure"] }
test = { cmd = "cd build && ctest -V --output-on-failure", depends-on = [
    "build",
] }

# Debug build (enables assertions and debug symbols)
configure-debug = "cmake -G Ninja -S . -B build-debug -DBUILD_PYTHON_BINDINGS=ON -DCMAKE_BUILD_TYPE=Debug"
build-debug = { cmd = "ninja -C build-debug", depends-on = ["configure-debug"] }
test-debug = { cmd = "cd build-debug && ctest -V --output-on-failure", depends-on = [
    "build-debug",
] }

# Legacy build (DEPRECATED - will be removed in next major release)
configure-legacy = "cmake -G Ninja -S . -B build -DBUILD_LEGACY=ON && echo '⚠️ WARNING: Legacy build is DEPRECATED and will be removed in next major release'"
build-legacy = { cmd = "ninja -C build", depends-on = ["configure-legacy"] }
test-legacy = { cmd = "cd build && ctest -V --output-on-failure", depends-on = [
    "build-legacy",
] }

# Python development tasks
install-dev = { cmd = "pip install -e . --no-build-isolation --config-settings=cmake.verbose=false", depends-on = ["build"] }
reinstall-dev = { cmd = "pip install -e . --no-build-isolation --force-reinstall --config-settings=cmake.verbose=false", depends-on = ["build"] }
python-test = { cmd = "python -c 'import tdcsophiread; print(f\"TDCSophiread {tdcsophiread.__version__} imported successfully\")'" }

# Fast development workflow (incremental builds)
dev-build = { cmd = "echo '✅ Development build complete - Python bindings ready'", depends-on = ["build", "install-dev"] }
dev-rebuild = { cmd = "echo '♻️ Development rebuild complete - Python bindings updated'", depends-on = ["clean", "build", "reinstall-dev"] }
dev-quick = { cmd = "ninja -C build && pip install -e . --no-build-isolation --config-settings=cmake.verbose=false && echo '⚡ Quick rebuild complete'" }

# Complete development workflow
dev-setup = { cmd = "echo '🚀 Complete development setup finished'", depends-on = ["build", "install-dev", "test", "python-test"] }
full-test = { cmd = "echo '✅ All tests passed'", depends-on = ["test", "python-test", "test-clustering"] }

# Data and notebook management
setup-data = "git submodule update --init notebooks/data && echo '📊 Sample data (12GB) downloaded successfully'"
run-jupyter = { cmd = "jupyter lab", depends-on = ["python-test"] }
run-notebooks = { cmd = "jupyter lab notebooks/", depends-on = ["python-test"] }

# Quick clustering tests
test-clustering = { cmd = "python -c 'import tdcsophiread; hits = tdcsophiread.process_tpx3(\"notebooks/data/tiny.tpx3\") if __import__(\"os\").path.exists(\"notebooks/data/tiny.tpx3\") else []; neutrons = tdcsophiread.process_hits_to_neutrons(hits) if len(hits) > 0 else []; print(f\"✅ Clustering test: {len(hits)} hits → {len(neutrons)} neutrons\")'", depends-on = ["python-test"] }
benchmark-algos = { cmd = "python -c 'exec(open(\"scripts/benchmark_clustering.py\").read())' 2>/dev/null || echo '⚠️ Benchmark script not found - run clustering test in notebooks'", depends-on = ["python-test"] }

# Publishing and packaging
sync-version = "python scripts/sync-version.py && echo '🔄 Version synchronized between C++ and Python'"
build-wheel = { cmd = "python -m build --wheel", depends-on = ["sync-version", "build"] }
build-wheel-bundled = { cmd = "python -m build --wheel && delocate-wheel -w . -v dist/*.whl && echo '📦 Dependencies bundled with delocate'", depends-on = ["sync-version", "build"] }
build-sdist = { cmd = "python -m build --sdist", depends-on = ["sync-version"] }
build-dist = { cmd = "python -m build", depends-on = ["sync-version", "build"] }
build-dist-bundled = { cmd = "python -m build && delocate-wheel -w . -v dist/*.whl && echo '📦 Complete distribution with bundled dependencies'", depends-on = ["sync-version", "build"] }
test-wheel = { cmd = "python -m pip install dist/*.whl --force-reinstall && python -c 'import tdcsophiread; print(f\"✅ Wheel test passed: {tdcsophiread.__version__}\")'", depends-on = ["build-wheel"] }

# PyPI publishing (requires API tokens)
publish-test = { cmd = "python -m twine upload --repository testpypi dist/* && echo '🚀 Published to Test PyPI'", depends-on = ["build-dist"] }
publish-pypi = { cmd = "python -m twine upload dist/* && echo '🚀 Published to PyPI'", depends-on = ["build-dist"] }

# Cross-platform wheel building (local)
build-wheels-local = "python -m cibuildwheel --output-dir wheelhouse && echo '🏗️ Cross-platform wheels built in wheelhouse/'"

# Other targets
package = { cmd = "ninja -C build package", depends-on = ["build"] }
docs = { cmd = "ninja -C build docs", depends-on = ["build"] }
clean = { cmd = "bash -c 'rm -rf build build-debug docs/html dist .eggs *.egg-info wheelhouse; find . -name \"__pycache__\" -type d -exec rm -rf {} + 2>/dev/null || true; find . -name \"*.pyc\" -delete 2>/dev/null || true; find . -name \"*.so\" -delete 2>/dev/null || true; echo \"🧹 Cleaned all build artifacts, docs, wheels, and Python cache files\"'" }

[dependencies]
python = "3.12.*"
cmake = ">=3.31.5,<4"
ninja = ">=1.12.1,<2"
clang-format = ">=19.1.7,<20"
hdf5 = ">=1.14.4,<2"
gtest = ">=1.16.0,<2"
eigen = ">=3.4.0,<4"
tbb-devel = ">=2022.0.0,<2023"
spdlog = ">=1.15.1,<2"
nlohmann_json = ">=3.11.3,<4"
doxygen = ">=1.13.2,<2"
graphviz = ">=12.2.1,<13"
pre-commit = ">=4.2.0,<5"
pybind11 = ">=2.13.6,<3"
numpy = ">=2.3.0,<3"
libgfortran = ">=5.0.0,<16"
matplotlib = ">=3.10.3,<4"
pydantic = ">=2.11.7,<3"
h5py = ">=3.12.0,<4"
scikit-build-core = ">=0.11.4,<0.12"
pip = ">=25.1.1,<26"
jupyterlab = ">=4.4.3,<5"
scipy = ">=1.16.0,<2"
pandas = ">=2.3.1,<3"
python-build = ">=1.2.2.post1,<2"
twine = ">=6.0.1,<7"
cibuildwheel = ">=2.22.0,<3"
delocate = ">=0.13.0,<1"

[target.linux-64.dependencies]
gxx_linux-64 = ">=14.2.0,<15"
libglu = ">=9.0.3,<10"
