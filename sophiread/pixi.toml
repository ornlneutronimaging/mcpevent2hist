[project]
authors = ["Chen Zhang <zhangc@ornl.gov>"]
channels = ["conda-forge"]
name = "sophiread"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# Primary TDC-only build (default)
configure = "cmake -G Ninja -S . -B build"
build = { cmd = "ninja -C build", depends-on = ["configure"] }
test = { cmd = "cd build && ctest -V --output-on-failure", depends-on = [
    "build",
] }
test-tdc = { cmd = "cd build && ctest -R TDC -V --output-on-failure", depends-on = [
    "build",
] }

# Legacy build (optional)
configure-legacy = "cmake -G Ninja -S . -B build -DBUILD_LEGACY=ON"
build-legacy = { cmd = "ninja -C build", depends-on = ["configure-legacy"] }
test-legacy = { cmd = "cd build && ctest -V --output-on-failure", depends-on = [
    "build-legacy",
] }

# Other targets
package = { cmd = "ninja -C build package", depends-on = ["build"] }
docs = { cmd = "ninja -C build docs", depends-on = ["build"] }
clean = "rm -rf build"

[dependencies]
python = "3.12.*"
cmake = ">=3.31.5,<4"
ninja = ">=1.12.1,<2"
clang-format = ">=19.1.7,<20"
hdf5 = ">=1.14.4,<2"
gtest = ">=1.16.0,<2"
eigen = ">=3.4.0,<4"
tbb-devel = ">=2022.0.0,<2023"
spdlog = ">=1.15.1,<2"
nlohmann_json = ">=3.11.3,<4"
doxygen = ">=1.13.2,<2"
graphviz = ">=12.2.1,<13"
pre-commit = ">=4.2.0,<5"
pybind11 = ">=2.13.6,<3"
numpy = ">=2.3.0,<3"
libgfortran = ">=5.0.0,<16"
matplotlib = ">=3.10.3,<4"
pydantic = ">=2.11.7,<3"
h5py = ">=3.12.0,<4"
scikit-build-core = ">=0.11.4,<0.12"
pip = ">=25.1.1,<26"
python-build = ">=1.2.2.post1,<2"
jupyterlab = ">=4.4.3,<5"

[target.linux-64.dependencies]
gxx_linux-64 = ">=14.2.0,<15"
libglu = ">=9.0.3,<10"
